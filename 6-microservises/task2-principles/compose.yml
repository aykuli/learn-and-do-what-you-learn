networks:
  fileservice:
    driver: bridge

volumes:
  minio-data:
  postgres-data:

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - fileservice
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000 # S3-API
      - 9001:9001 # Console
    volumes:
      - minio-data:/data
    entrypoint: minio
    command: server --console-address ":9001" /data
    # The healthcheck guarantees that the MC container waits until MinIO is fully ready
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
  # This companion service auto-creates your bucket and then exits gracefully
  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fileservice
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      if ! mc ls myminio/${MINIO_BUCKET_NAME} > /dev/null 2>&1; then
        mc mb myminio/${MINIO_BUCKET_NAME};
        echo 'Bucket created successfully.';
      else
        echo 'Bucket already exists. Skipping.';
      fi
      "

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    networks:
      - fileservice
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-security_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  security:
    build: 
      context: ./services
      dockerfile: Dockerfile.security
    container_name: security
    networks:
      - fileservice
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
    depends_on:
      postgres:
        condition: service_healthy
  uploader:
    build:
      context: ./services
      dockerfile: Dockerfile.uploader
    container_name: uploader
    networks:
      - fileservice
    ports:
      - "8081:8081"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - SECURITY_SERVICE_URL=http://security:8080
      - UPLOADER_PORT=${UPLOADER_PORT}
    depends_on:
      minio:
        condition: service_healthy
      security:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fileservice