networks:
  fileservice:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  elasticsearch-data:
  grafana-data:
  victoriametrics-data:
  prometheus-data:

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - fileservice
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # разрешить сбор метрик без токенов
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - 9000:9000 # S3-API
      - 9001:9001 # Console
    volumes:
      - minio-data:/data
    entrypoint: minio
    command: server --console-address ":9001" /data
    # The healthcheck guarantees that the MC container waits until MinIO is fully ready
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
  # This companion service auto-creates bucket and then exits gracefully
  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fileservice
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      if ! mc ls myminio/${MINIO_BUCKET_NAME} > /dev/null 2>&1; then
        mc mb myminio/${MINIO_BUCKET_NAME};
        echo 'Bucket created successfully.';
      else
        echo 'Bucket already exists. Skipping.';
      fi
      "

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    networks:
      - fileservice
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-security_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  security:
    build: 
      context: ./services
      dockerfile: Dockerfile.security
    container_name: security
    networks:
      - fileservice
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
  uploader:
    build:
      context: ./services
      dockerfile: Dockerfile.uploader
    container_name: uploader
    networks:
      - fileservice
    ports:
      - "8082:8082"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - SECURITY_SERVICE_URL=http://security:8080
      - UPLOADER_PORT=${UPLOADER_PORT}
    depends_on:
      minio:
        condition: service_healthy
      security:
        condition: service_started
    logging:
      driver: "json-file"
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fileservice

# --- СЕРВИСЫ ЛОГИРОВАНИЯ ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true # Включаем авторизацию
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # Лимиты памяти для Java
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - fileservice
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTICSEARCH_PASSWORD} -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 5s
      timeout: 5s
      retries: 10
  es-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es_init
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - fileservice
    environment:
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Provisioning roles and security privileges..."
        
        # 1. Create a dedicated role allowing index auto-creation and writing for vector-* indices
        curl -s -X POST -u "elastic:$${ELASTICSEARCH_PASSWORD}" \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/role/vector_writer \
          -d '{
            "cluster": ["manage_index_templates", "monitor"],
            "indices": [
              {
                "names": ["vector-*"],
                "privileges": ["create_index", "write", "create", "manage"]
              }
            ]
          }'

        echo ""
        echo "Role 'vector_writer' created. Assigning to user..."

        # 2. Update your custom user giving them kibana_admin (for UI dashboards) AND vector_writer (for log writing)
        curl -s -X POST -u "elastic:$${ELASTICSEARCH_PASSWORD}" \
          -H "Content-Type: application/json" \
          "http://elasticsearch:9200/_security/user/$${ELASTICSEARCH_USERNAME}" \
          -d "{\"password\":\"$${ELASTICSEARCH_PASSWORD}\",\"roles\":[\"kibana_admin\", \"vector_writer\", \"monitoring_user\",\"kibana_system\",\"viewer\"]}"
          
        # 3. Synchronize background system user credentials
        curl -s -X POST -u "elastic:$${ELASTICSEARCH_PASSWORD}" \
          -H "Content-Type: application/json" \
          "http://elasticsearch:9200/_security/user/kibana_system/_password" \
          -d "{\"password\":\"$${ELASTICSEARCH_PASSWORD}\"}"
          
        echo ""
        echo "Security architecture fully provisioned!"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - SERVER_PORT=8081
      - XPACK_SECURITY_ENCRYPTIONKEY=a_secure_minimum_32_character_string_key_1
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a_secure_minimum_32_character_string_key_2
    ports:
      - "8081:8081"
    networks:
      - fileservice
    depends_on:
      elasticsearch:
        condition: service_healthy

  vector:
    image: timberio/vector:0.40.0-alpine
    container_name: vector
    environment:
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    volumes:
      # Передаем конфигурационный файл внутрь контейнера
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      # Передаем сокет докера, чтобы Vector видел stdout всех контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fileservice
    depends_on:
      elasticsearch:
        condition: service_healthy

# --- СЕРВИСЫ МОНИТОРИНГА ---
  node-exporter:
    image: prom/node-exporter:master
    container_name: node_exporter
    pid: host          # Without pid: host, Node Exporter cannot inspect processes running directly on your host machine
    network_mode: host # Gives Node Exporter access to real host interfaces (eth0, wlan0, etc.)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
    ports:
     - '9090:9090'
    networks:
      - fileservice
    extra_hosts: ["host.docker.internal:host-gateway"] # for node-exporter service

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: victoria_metrics
    ports:
      - '8428:8428'
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    networks:
      - fileservice
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    network_mode: host
    environment:
      - DATA_SOURCE_URI=${POSTGRES_URI}
      - DATA_SOURCE_USER=${POSTGRES_USER}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.15-ubuntu
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/config/grafana.ini:/etc/grafana/config/grafana.ini:ro
    ports:
     - '3000:3000'
    extra_hosts:
      - "host.docker.internal:host-gateway" # Для вебхуков на http://docker.internal
    networks:
      - fileservice
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_NAME}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=false
    depends_on:
      - prometheus
      - victoriametrics
    restart: unless-stopped