user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/log/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access_log main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # =========================================================================
        # 1. INTERNAL AUTH VALIDATION ENDPOINT (Hidden from public)
        # =========================================================================
        location = /_internal_auth_validate {
            internal; # Cannot be called directly by external clients
            
            # Forward the incoming client's Authorization header
            proxy_set_header Authorization $http_authorization;
            
            # Clear request body for the subrequest optimization
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            # Call your security container validation route
            proxy_pass http://security:8080/v1/token/validation;
        }

        # =========================================================================
        # 2. ANONYMOUS ROUTES
        # =========================================================================

        # POST /v1/register -> security POST /v1/user
        location = /v1/register {
            # Only allow POST requests
            if ($request_method != POST) { return 405; }
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Rewrite URI to point to what the security service expects
            proxy_pass http://security:8080/v1/user;
        }

        # POST /v1/token -> security POST /v1/token
        location = /v1/token {
            if ($request_method != POST) { return 405; }
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_pass http://security:8080/v1/token;
        }

        # =========================================================================
        # 3. PROTECTED ROUTES (Requires Authorization: Bearer ...)
        # =========================================================================

        # GET /v1/user -> security GET /v1/user
        location = /v1/user {
            if ($request_method != GET) { return 405; }
            
            # Enforce JWT validation via background subrequest
            auth_request /_internal_auth_validate;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_pass http://security:8080/v1/user;
        }

        # POST /v1/upload -> uploader POST /v1/upload
        location = /v1/upload {
            if ($request_method != POST) { return 405; }
            
            auth_request /_internal_auth_validate;
            
            # Increase body limits for multipart file uploads
            client_max_body_size 25M;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_pass http://uploader:8082/v1/upload;
        }

        # GET /v1/user/{image} -> uploader GET /v1/user/{image}
        # Note: Your uploader service already enforces ownership checks, 
        # but NGINX intercepts it at port 80 to do standard gateway checks first.
        location ~ ^/v1/user/(.+\.(jpg|jpeg|png|gif))$ {
            if ($request_method != GET) { return 405; }
            
            auth_request /_internal_auth_validate;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Extracts the wildcard backreference matches ($1) and proxies straight to the MinIO images bucket
            proxy_pass http://uploader:8082/v1/user/$1;
        }
    }
}
