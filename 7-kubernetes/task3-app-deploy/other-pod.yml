apiVersion: v1
kind: Pod
metadata:
  name: othr-multitool
  namespace: netology-learn
spec:
  containers:
    - name: multitool
      image: wbitt/network-multitool:latest
      ports:
        - containerPort: 8080
      env:
        - name: HTTP_PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "10443"