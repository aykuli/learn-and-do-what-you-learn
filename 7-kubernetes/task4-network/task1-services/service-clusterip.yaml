apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: netology-learn
spec:
  type: ClusterIP
  selector:
    app: aynur
  ports:
    - name: nginx
      protocol: TCP
      port: 9001
      targetPort: 80
    - name: multitool
      protocol: TCP
      port: 9002
      targetPort: 8080
