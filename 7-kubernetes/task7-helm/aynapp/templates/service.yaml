apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aynapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ .Values.service.portname }}
      port: {{ .Values.service.port }}
      protocol: TCP
      {{- if .Values.service.nodePortCreate}}
      nodePort: {{ .Values.service.nodePort}}
      {{- end }}
  selector:
    {{- include "aynapp.selectorLabels" . | nindent 4 }}
